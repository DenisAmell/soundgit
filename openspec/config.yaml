schema: spec-driven

context: |
  SoundGit — контроль версий и совместная работа над проектами DAW («Git для музыки»).
  Магистерская диссертация (МАИ): прототип должен давать измеримые результаты экспериментов.

  Перед созданием артефактов прочитай:
    - openspec/vision.md        — идея, цели, не-цели, анти-цели, словарь
    - openspec/architecture.md  — компоненты, IR, объектная модель, слияние, синхронизация
    - openspec/roadmap.md       — этапы, критерии готовности, зоны агентов

  Ограничения, которые нельзя нарушать:
    - Стек зафиксирован: Go (ядро/агент), C++/JUCE (клиент), NestJS + PostgreSQL + S3/MinIO (сервер),
      Python/PyTorch (исследования), Docker.
    - Плагин VST3/AU не видит проект хоста: вся работа с проектом идёт через файл на диске во внешнем процессе.
    - Клиент JUCE тонкий: processBlock пуст, никакой логики версий, сети до сервера и ввода-вывода в аудиопотоке.
    - Нет потери данных: круг «разбор → запись» файла проекта без потерь; рабочее состояние не перезаписывается
      без страховочного снимка; история не переписывается.
    - Слияние выполняется только на клиенте; сервер проверяет fast-forward и хранит объекты.
    - Офлайн: все операции, кроме push/pull, работают без сети.
    - Мультиплатформенность: macOS, Windows, Linux — в дизайне и задачах каждого изменения.
    - Коммерческие плагины: только манифест-ссылка, без бинарников.
    - Целевая DAW прототипа — Reaper (.rpp); Ableton Live (.als) — после.

  Язык артефактов — русский; идентификаторы, имена команд и ключевые слова SHALL/MUST — латиницей.
  Решения, принятые при проектировании, помечай «[решение]» с причиной и отвергнутой альтернативой.

rules:
  proposal:
    - Указывай этап roadmap.md, к которому относится изменение, и что явно вне рамок
  design:
    - Сверяй решения с architecture.md; при расхождении обнови architecture.md в том же изменении
  specs:
    - Описывай наблюдаемое поведение CLI/API, без имён пакетов и функций
  tasks:
    - Каждая задача заканчивается проверяемым результатом (тест или команда)
    - Первая группа задач — тесты и тестовые данные, затем реализация

operations:
  archive:
    guidance:
      - После архивации обнови статус этапа в openspec/roadmap.md и таблицу состояния в README.md
