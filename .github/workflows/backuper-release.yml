name: backuper-release

# Builds the installers of Audio Backuper, checks each by installing it, and
# on a tag attaches them to a draft release for a human to publish.
#
#   tag backuper-v<version>   a release build; the tag must match the version in the code
#   manual run                the same build without a release
#   push touching packaging   a dry run, so that changes to the scripts are tested
on:
  push:
    tags: ["backuper-v*"]
    branches: ["**"]
    paths: ["tools/packaging/**", ".github/workflows/backuper-release.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Optional. Without them the build still works: browser sign-in is switched
  # off in the plugin and the installers are not signed.
  OAUTH_JSON: ${{ secrets.BACKUPER_OAUTH_JSON }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' core/internal/backuper/helper/helper.go)"
          [ -n "$version" ] || { echo "cannot read the version from helper.go"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version in the code: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "backuper-v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version in the code (backuper-v$version)"
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Cloud application identifiers
        if: env.OAUTH_JSON != ''
        run: printf '%s' "$OAUTH_JSON" > juce-client/oauth.json
      - name: Signing certificates
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          printf '%s' "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificates.p12"
          if [ -n "$NOTARY_APPLE_ID" ]; then
            xcrun notarytool store-credentials audio-backuper --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
            echo "MACOS_NOTARY_PROFILE=audio-backuper" >> "$GITHUB_ENV"
          fi
      - name: Build, package and check by installing
        run: tools/packaging/macos/build-pkg.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: AudioBackuper-${{ needs.version.outputs.version }}-macOS
          path: dist/*.pkg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Cloud application identifiers
        if: env.OAUTH_JSON != ''
        shell: bash
        run: printf '%s' "$OAUTH_JSON" > juce-client/oauth.json
      - name: Build the plugin
        run: |
          cmake -S juce-client -B juce-client/build -DAUDIO_BACKUPER_TESTS=OFF
          cmake --build juce-client/build --config Release --parallel 4 --target AudioBackuper_VST3
      - name: Package
        id: package
        run: tools\packaging\windows\build-installer.ps1 -BuildDir juce-client\build -OutDir dist
      - name: Check by installing
        run: tools\packaging\windows\verify-installer.ps1 -Installer "${{ steps.package.outputs.installer }}" -Version "${{ steps.package.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AudioBackuper-${{ needs.version.outputs.version }}-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Audio Backuper ${{ needs.version.outputs.version }}" \
            --notes "Installers of Audio Backuper ${{ needs.version.outputs.version }}. Files named -unsigned are test builds: the system will warn that the developer is unknown."
